<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lennep ofrece teleradiología y diagnóstico por imágenes para clínicas, hospitales y centros de salud, con más de 35 especialistas activos 24/7."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#4fc7c4" />
    <script>
      (function () {
        try {
          if (localStorage.getItem('lennep-color-scheme') === 'verde-celeste') {
            document.documentElement.setAttribute('data-color-scheme', 'verde-celeste')
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#42a5d4')
          }
        } catch (e) {}
      })()
    </script>
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/logo.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Lennep | Teleradiología y diagnóstico por imágenes 24/7</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
